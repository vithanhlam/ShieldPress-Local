<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>S3 Objects</title><link rel="stylesheet" href="css/main.css"><style>html,body{height:100%;margin:0;overflow:hidden;background:var(--bg)}#s3-root{height:100vh;display:flex;flex-direction:column}.s3-titlebar{display:flex;align-items:center;gap:10px;padding:11px 15px;border-bottom:1px solid var(--border);background:var(--bg1);-webkit-app-region:drag}.s3-titlebar .no-drag{margin-left:auto;-webkit-app-region:no-drag}.s3-session-body{flex:1;min-height:0;padding:16px;display:flex}.s3-browser-columns{width:100%;min-height:0;height:100%}.s3-upload-log{max-height:none}</style></head><body><div id="s3-root"><div class="s3-titlebar"><i class="fas fa-cloud" style="color:var(--accent)"></i><strong id="s3-session-title">S3 Objects</strong><button class="btn btn-ghost btn-sm no-drag" onclick="window.close()"><i class="fas fa-times"></i> Close</button></div><div class="s3-session-body"><div class="s3-browser-columns"><aside class="s3-upload-panel"><h4><i class="fas fa-cloud-upload-alt"></i> Upload & activity</h4><button class="btn btn-primary" onclick="S3.uploadFiles()"><i class="fas fa-upload"></i> Upload files</button><button class="btn btn-ghost" onclick="S3.uploadFolder()"><i class="fas fa-folder-open"></i> Upload folder</button><div class="s3-drop-zone"><i class="fas fa-cloud-upload-alt"></i> Drop files or folders here</div><div id="s3-upload-log" class="s3-upload-log"></div></aside><section class="s3-files-panel"><div class="s3-browser-toolbar"><button class="btn btn-ghost btn-sm" onclick="S3.goParent()"><i class="fas fa-arrow-up"></i></button><span id="s3-breadcrumb" class="s3-breadcrumb"></span><button class="btn btn-ghost btn-sm" onclick="S3.refreshBrowser()"><i class="fas fa-sync"></i> Refresh</button></div><div id="s3-object-list" class="s3-object-list"></div><div id="s3-pagination" class="s3-pagination"></div></section></div></div></div><script>window.__s3Session=true;window.App={currentPage:'s3'};window.toast=(m)=>console.log(m);window.fmtBytes=(b)=>b>1048576?(b/1048576).toFixed(1)+'MB':(b/1024).toFixed(0)+'KB';</script><script src="js/s3.js"></script><script src="js/s3-session.js"></script></body></html>
