<div class="page-header">
  <div>
    <div class="page-title">Node.js</div>
    <div class="page-sub">Running Node ports, project dev servers, start / stop / restart & logs</div>
  </div>
  <button class="btn btn-primary" onclick="NodeManager.refresh(true)">
    <i class="fas fa-sync"></i> Refresh
  </button>
</div>

<!-- Project dev servers -->
<div class="card" style="margin-bottom:12px">
  <div class="card-hdr">
    <span class="card-title"><i class="fab fa-node-js" style="color:var(--green)"></i> Node projects</span>
  </div>
  <div class="card-body" id="node-projects" style="font-size:13px;color:var(--text2)">
    <i class="fas fa-spinner fa-spin"></i> Loading...
  </div>
</div>

<!-- Listening ports -->
<div class="card" style="margin-bottom:12px">
  <div class="card-hdr">
    <span class="card-title"><i class="fas fa-network-wired" style="color:var(--blue)"></i> Listening Node processes</span>
    <span id="node-proc-count" class="tag" style="background:var(--bg3);color:var(--text3)">0</span>
  </div>
  <div class="card-body" id="node-processes" style="font-size:13px;color:var(--text2)">
    <i class="fas fa-spinner fa-spin"></i> Loading...
  </div>
</div>

<!-- Logs -->
<div class="card" id="node-log-card" style="display:none">
  <div class="card-hdr">
    <span class="card-title"><i class="fas fa-terminal"></i> Log — <span id="node-log-name"></span></span>
    <button class="btn btn-ghost btn-sm" onclick="NodeManager.closeLogs()"><i class="fas fa-times"></i></button>
  </div>
  <div class="card-body">
    <pre id="node-log-out" style="max-height:320px;overflow:auto;margin:0;font-size:12px;white-space:pre-wrap;word-break:break-all"></pre>
  </div>
</div>
