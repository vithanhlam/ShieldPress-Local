[PHP]
engine=On
short_open_tag=Off
precision=14
output_buffering=4096
serialize_precision=-1
max_execution_time=300
max_input_time=300
memory_limit=512M
error_reporting=E_ALL
display_errors=On
display_startup_errors=On
log_errors=On
post_max_size=512M
upload_max_filesize=512M
max_file_uploads=50
default_socket_timeout=60
cgi.force_redirect=0
cgi.fix_pathinfo=1

[Date]
date.timezone=Asia/Ho_Chi_Minh

[Session]
session.save_handler=files

[Extensions]
extension=bcmath
extension=bz2
extension=calendar
extension=ctype
extension=curl
extension=dom
extension=exif
extension=fileinfo
extension=ftp
extension=gd
extension=gettext
extension=gmp
extension=iconv
extension=intl
extension=ldap
extension=mbstring
extension=mysqlnd
extension=mysqli
extension=pdo
extension=pdo_mysql
extension=pdo_pgsql
extension=pdo_sqlite
extension=pgsql
extension=phar
extension=posix
extension=readline
extension=simplexml
extension=soap
extension=sockets
extension=sqlite3
; tidy needs libtidy which is not always present on the host — enable when bundled.
; extension=tidy
extension=tokenizer
extension=xml
extension=xmlreader
extension=xmlwriter
extension=xsl
extension=zip
; Ubuntu PHP 8.5 builds ship Zend OPcache in the binary; do not load opcache.so.
; zend_extension=opcache

[opcache]
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=128
